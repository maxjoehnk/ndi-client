[package]
name = "ndi-client"
version = "0.1.0"
edition = "2021"

[dependencies]
ndi = { git = "https://github.com/maxjoehnk/ndi-rs", branch = "feature/ndi-5" }
winit = "0.30"
wgpu = "28"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.48", features = ["rt", "macros"] }
image = { version = "0.25", features = [] }
bytemuck = { version = "1.24", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
keep-active = "0.1"
dashmap = "6.1"
