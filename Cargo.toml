[package]
name = "ndi-client"
version = "0.1.0"
edition = "2021"

[dependencies]
ndi = { git = "https://github.com/maxjoehnk/ndi-rs", branch = "feature/ndi-5" }
winit = "0.29"
wgpu = "28"
#egui = "0.26"
#egui-wgpu = { version = "0.26", features = ["winit"] }
#egui-winit = "0.26"
#raw-window-handle = "0.5"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-utils = "0.8"
tokio = { version = "1.48", features = ["rt", "macros"] }
image = { version = "0.25", features = [] }
bytemuck = { version = "1.24", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
keep-active = "0.1"
